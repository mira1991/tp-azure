###############################################################################
# Terraform / OpenStack infrastructure pipeline
#
# Flow per environment:  validate -> plan (automatic) -> apply (manual)
# State lives in the GitLab-managed Terraform state backend, one state per
# environment. TF_STATE_NAME is the single definition of which environment a
# job acts on: the variables file, the state, the environment and the
# concurrency lock are all derived from it.
#
# The required CI/CD variables are listed in docs/infrastructure.md.
###############################################################################

# One pipeline per change: branch pipelines stand down while a merge request
# is open, so a push to an MR branch does not run the whole stage twice.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_VARS_FILE: environments/${TF_STATE_NAME}.tfvars
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  TF_CLI_ARGS_destroy: "-lock-timeout=300s"

# Resources are created in dependency order, one stage per layer, using
# -target. Each layer must exist before the next one can be planned, so a
# failure stops the rollout at the layer that broke instead of half-building
# the stack.
stages:
  - validate
  - plan
  - apply-network
  - apply-security
  - apply-compute
  - destroy

###############################################################################
# Job templates
###############################################################################

.terraform:
  image: registry.gitlab.com/gitlab-org/terraform-images/stable:latest
  before_script:
    - cd "${TF_ROOT}"
  # The cached directory holds provider plugins, which depend on the lock file
  # and nothing else. One key therefore serves every environment.
  cache:
    key:
      files:
        - terraform/.terraform.lock.hcl
    paths:
      - ${TF_ROOT}/.terraform

.plan:
  extends: .terraform
  stage: plan
  needs:
    - validate
  script:
    - gitlab-terraform init
    - gitlab-terraform plan -var-file="${TF_VARS_FILE}"
    - gitlab-terraform plan-json
  environment:
    action: prepare
  # Only the report is kept: each apply layer re-plans against the state left
  # by the previous layer, so a saved plan from this job would be stale by the
  # time the rollout reaches it.
  artifacts:
    expire_in: 2 days
    reports:
      terraform: ${TF_ROOT}/plan.json

# One layer of the stack. TF_TARGET limits the plan to that layer; the final
# layer leaves it empty so the last apply converges the whole configuration
# and picks up anything the targeted runs skipped.
.apply_layer:
  extends: .terraform
  script:
    - gitlab-terraform init
    - gitlab-terraform plan ${TF_TARGET:+-target=$TF_TARGET} -var-file="${TF_VARS_FILE}"
    - gitlab-terraform apply
  resource_group: ${TF_STATE_NAME}

.layer_network:
  stage: apply-network
  variables:
    TF_TARGET: module.network

.layer_security:
  stage: apply-security
  variables:
    TF_TARGET: module.security

.layer_compute:
  stage: apply-compute
  variables:
    TF_TARGET: ""

.destroy:
  extends: .terraform
  stage: destroy
  needs: []
  script:
    - gitlab-terraform init
    - gitlab-terraform destroy -var-file="${TF_VARS_FILE}"
  resource_group: ${TF_STATE_NAME}
  environment:
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

.dev:
  variables:
    TF_STATE_NAME: dev
  environment:
    name: dev

.staging:
  variables:
    TF_STATE_NAME: staging
  environment:
    name: staging

.prod:
  variables:
    TF_STATE_NAME: prod
  environment:
    name: prod

###############################################################################
# validate: runs on every pipeline
###############################################################################

validate:
  extends: .terraform
  stage: validate
  needs: []
  script:
    - terraform fmt -recursive -check -diff
    # -backend=false validates the configuration without touching any state.
    - terraform init -backend=false
    - terraform validate

tflint:
  stage: validate
  needs: []
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  variables:
    TFLINT_PLUGIN_DIR: ${CI_PROJECT_DIR}/.tflint.d/plugins
  cache:
    key:
      files:
        - .tflint.hcl
    paths:
      - .tflint.d/plugins
  before_script:
    - cd "${TF_ROOT}"
  script:
    - tflint --init
    - tflint --recursive --format compact
  allow_failure: true

security_scan:
  stage: validate
  needs: []
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov --directory "${TF_ROOT}" --framework terraform --quiet --compact --output cli --output junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: checkov.xml
  allow_failure: true

###############################################################################
# dev: plans on every merge request, rolls out layer by layer from the
# default branch
###############################################################################

plan:dev:
  extends: [.plan, .dev]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

network:dev:
  extends: [.apply_layer, .layer_network, .dev]
  needs:
    - plan:dev
  # The one manual gate of the rollout: the later layers follow automatically
  # once the network is up.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

security:dev:
  extends: [.apply_layer, .layer_security, .dev]
  needs:
    - network:dev

compute:dev:
  extends: [.apply_layer, .layer_compute, .dev]
  needs:
    - security:dev
  environment:
    on_stop: destroy:dev

destroy:dev:
  extends: [.destroy, .dev]

###############################################################################
# staging: plans on the default branch, rolls out layer by layer
###############################################################################

plan:staging:
  extends: [.plan, .staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

network:staging:
  extends: [.apply_layer, .layer_network, .staging]
  needs:
    - plan:staging
  # The one manual gate of the rollout: the later layers follow automatically
  # once the network is up.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

security:staging:
  extends: [.apply_layer, .layer_security, .staging]
  needs:
    - network:staging

compute:staging:
  extends: [.apply_layer, .layer_compute, .staging]
  needs:
    - security:staging
  environment:
    on_stop: destroy:staging

destroy:staging:
  extends: [.destroy, .staging]

###############################################################################
# prod: plans on the default branch and on tags, rolls out layer by layer
###############################################################################

plan:prod:
  extends: [.plan, .prod]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

network:prod:
  extends: [.apply_layer, .layer_network, .prod]
  needs:
    - plan:prod
  # The one manual gate of the rollout: the later layers follow automatically
  # once the network is up.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false

security:prod:
  extends: [.apply_layer, .layer_security, .prod]
  needs:
    - network:prod

compute:prod:
  extends: [.apply_layer, .layer_compute, .prod]
  needs:
    - security:prod
  environment:
    on_stop: destroy:prod

destroy:prod:
  extends: [.destroy, .prod]
