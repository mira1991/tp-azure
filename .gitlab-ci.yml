###############################################################################
# Terraform / OpenStack infrastructure pipeline
#
# Flow per environment:  validate -> plan (automatic) -> apply (manual)
# State lives in the GitLab-managed Terraform state backend, one state per
# environment (TF_STATE_NAME), so the environments never overwrite each other.
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected):
#   TF_VAR_os_auth_url      https://keystone.example.net:5000/v3
#   TF_VAR_os_user_name     terraform
#   TF_VAR_os_password      ********           (masked)
#   TF_VAR_os_project_name  infra
#   TF_VAR_os_region        RegionOne
#   TF_VAR_ssh_public_key   ssh-ed25519 AAAA...
###############################################################################

image: registry.gitlab.com/gitlab-org/terraform-images/stable:latest

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"

cache:
  key: "${TF_STATE_NAME}"
  paths:
    - ${TF_ROOT}/.terraform

before_script:
  - cd "${TF_ROOT}"

stages:
  - validate
  - plan
  - apply
  - destroy

###############################################################################
# Hidden job templates
###############################################################################

.tf_env_dev: &tf_env_dev
  TF_STATE_NAME: dev
  TF_VARS_FILE: environments/dev.tfvars

.tf_env_staging: &tf_env_staging
  TF_STATE_NAME: staging
  TF_VARS_FILE: environments/staging.tfvars

.tf_env_prod: &tf_env_prod
  TF_STATE_NAME: prod
  TF_VARS_FILE: environments/prod.tfvars

.plan: &plan_definition
  stage: plan
  script:
    - gitlab-terraform init
    - gitlab-terraform validate
    - gitlab-terraform plan -var-file="${TF_VARS_FILE}"
    - gitlab-terraform plan-json -var-file="${TF_VARS_FILE}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ${TF_ROOT}/plan.cache
    reports:
      terraform: ${TF_ROOT}/plan.json

.apply: &apply_definition
  stage: apply
  script:
    - gitlab-terraform init
    - gitlab-terraform apply
  resource_group: ${TF_STATE_NAME}
  when: manual

.destroy: &destroy_definition
  stage: destroy
  script:
    - gitlab-terraform init
    - gitlab-terraform destroy -var-file="${TF_VARS_FILE}"
  resource_group: ${TF_STATE_NAME}
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

###############################################################################
# validate
###############################################################################

fmt:
  stage: validate
  script:
    - terraform fmt -recursive -check -diff
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

validate:
  stage: validate
  variables:
    TF_STATE_NAME: dev
  script:
    # -backend=false validates the configuration without touching any state.
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

tflint:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - tflint --init
    - tflint --recursive --format compact
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

security_scan:
  stage: validate
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  before_script: []
  script:
    - checkov --directory "${TF_ROOT}" --framework terraform --quiet --compact --output cli --output junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: checkov.xml
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

###############################################################################
# dev: plans on every merge request, applies from the default branch
###############################################################################

plan:dev:
  <<: *plan_definition
  variables:
    <<: *tf_env_dev
  environment:
    name: dev
    action: prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:dev:
  <<: *apply_definition
  variables:
    <<: *tf_env_dev
  environment:
    name: dev
    on_stop: destroy:dev
  dependencies:
    - plan:dev
  needs:
    - plan:dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

destroy:dev:
  <<: *destroy_definition
  variables:
    <<: *tf_env_dev
  environment:
    name: dev
    action: stop

###############################################################################
# staging: plans on the default branch, applies manually
###############################################################################

plan:staging:
  <<: *plan_definition
  variables:
    <<: *tf_env_staging
  environment:
    name: staging
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:staging:
  <<: *apply_definition
  variables:
    <<: *tf_env_staging
  environment:
    name: staging
  dependencies:
    - plan:staging
  needs:
    - plan:staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

destroy:staging:
  <<: *destroy_definition
  variables:
    <<: *tf_env_staging
  environment:
    name: staging
    action: stop

###############################################################################
# prod: plans on the default branch and on tags, applies manually
###############################################################################

plan:prod:
  <<: *plan_definition
  variables:
    <<: *tf_env_prod
  environment:
    name: prod
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

apply:prod:
  <<: *apply_definition
  variables:
    <<: *tf_env_prod
  environment:
    name: prod
  dependencies:
    - plan:prod
  needs:
    - plan:prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

destroy:prod:
  <<: *destroy_definition
  variables:
    <<: *tf_env_prod
  environment:
    name: prod
    action: stop
