###############################################################################
# Terraform / OpenStack infrastructure pipeline
#
# Flow per environment:  validate -> plan (automatic) -> apply (manual)
# State lives in the GitLab-managed Terraform state backend, one state per
# environment. TF_STATE_NAME is the single definition of which environment a
# job acts on: the variables file, the state, the environment and the
# concurrency lock are all derived from it.
#
# The required CI/CD variables are listed in docs/infrastructure.md.
###############################################################################

# One pipeline per change: branch pipelines stand down while a merge request
# is open, so a push to an MR branch does not run the whole stage twice.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_VARS_FILE: environments/${TF_STATE_NAME}.tfvars
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  TF_CLI_ARGS_destroy: "-lock-timeout=300s"

stages:
  - validate
  - plan
  - apply
  - destroy

###############################################################################
# Job templates
###############################################################################

.terraform:
  image: registry.gitlab.com/gitlab-org/terraform-images/stable:latest
  before_script:
    - cd "${TF_ROOT}"
  # The cached directory holds provider plugins, which depend on the lock file
  # and nothing else. One key therefore serves every environment.
  cache:
    key:
      files:
        - terraform/.terraform.lock.hcl
    paths:
      - ${TF_ROOT}/.terraform

.plan:
  extends: .terraform
  stage: plan
  needs:
    - validate
  script:
    - gitlab-terraform init
    - gitlab-terraform plan -var-file="${TF_VARS_FILE}"
    - gitlab-terraform plan-json
  environment:
    action: prepare
  artifacts:
    expire_in: 2 days
    paths:
      - ${TF_ROOT}/plan.cache
    reports:
      terraform: ${TF_ROOT}/plan.json

# Applies the reviewed plan artifact, so it never re-plans against newer state.
.apply:
  extends: .terraform
  stage: apply
  script:
    - gitlab-terraform init
    - gitlab-terraform apply
  resource_group: ${TF_STATE_NAME}

.destroy:
  extends: .terraform
  stage: destroy
  needs: []
  script:
    - gitlab-terraform init
    - gitlab-terraform destroy -var-file="${TF_VARS_FILE}"
  resource_group: ${TF_STATE_NAME}
  environment:
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

.dev:
  variables:
    TF_STATE_NAME: dev
  environment:
    name: dev

.staging:
  variables:
    TF_STATE_NAME: staging
  environment:
    name: staging

.prod:
  variables:
    TF_STATE_NAME: prod
  environment:
    name: prod

###############################################################################
# validate: runs on every pipeline
###############################################################################

validate:
  extends: .terraform
  stage: validate
  needs: []
  script:
    - terraform fmt -recursive -check -diff
    # -backend=false validates the configuration without touching any state.
    - terraform init -backend=false
    - terraform validate

tflint:
  stage: validate
  needs: []
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  variables:
    TFLINT_PLUGIN_DIR: ${CI_PROJECT_DIR}/.tflint.d/plugins
  cache:
    key:
      files:
        - .tflint.hcl
    paths:
      - .tflint.d/plugins
  before_script:
    - cd "${TF_ROOT}"
  script:
    - tflint --init
    - tflint --recursive --format compact
  allow_failure: true

security_scan:
  stage: validate
  needs: []
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov --directory "${TF_ROOT}" --framework terraform --quiet --compact --output cli --output junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: checkov.xml
  allow_failure: true

###############################################################################
# dev: plans on every merge request, applies from the default branch
###############################################################################

plan:dev:
  extends: [.plan, .dev]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:dev:
  extends: [.apply, .dev]
  needs:
    - plan:dev
  environment:
    on_stop: destroy:dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

destroy:dev:
  extends: [.destroy, .dev]

###############################################################################
# staging: plans on the default branch, applies manually
###############################################################################

plan:staging:
  extends: [.plan, .staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:staging:
  extends: [.apply, .staging]
  needs:
    - plan:staging
  environment:
    on_stop: destroy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

destroy:staging:
  extends: [.destroy, .staging]

###############################################################################
# prod: plans on the default branch and on tags, applies manually
###############################################################################

plan:prod:
  extends: [.plan, .prod]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

apply:prod:
  extends: [.apply, .prod]
  needs:
    - plan:prod
  environment:
    on_stop: destroy:prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual

destroy:prod:
  extends: [.destroy, .prod]
