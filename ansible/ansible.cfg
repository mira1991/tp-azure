# Configuration Ansible des playbooks de préparation/validation et des
# exécutions kolla-ansible lancées depuis les jobs GitLab.
[defaults]
host_key_checking = False
gathering = smart
forks = 10
timeout = 30
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
deprecation_warnings = False
roles_path = roles

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
retries = 3

[privilege_escalation]
become = True
become_method = sudo
